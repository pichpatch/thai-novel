[project]
name = "thai-novel"
version = "0.2.0"
description = "Cinematic AI-native Thai audiobook production pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "whai" }]

dependencies = [
  # CLI + UX
  "typer>=0.15.0",
  "rich>=13.9.0",

  # Schema + validation
  "pydantic>=2.10.0",

  # Async + IO
  "aiohttp>=3.11.0",
  "aiofiles>=24.1.0",

  # Thai text + TTS
  "edge-tts>=7.0.0",
  "pythainlp>=5.0.0",
  "soundfile>=0.13.0",
  "numpy>=2.0.0",

  # Audio + loudness (pyloudnorm wraps ffmpeg loudnorm semantics in pure Python)
  "pyloudnorm>=0.1.1",

  # Image handling (needed by both the SDXL fallback and the Lanczos upscaler)
  "Pillow>=11.0.0",

  # Image gen (lazy-imported per backend so the dep is optional at runtime)
  # MLX path:
  #   mlx, mlx-lm
  # CoreML path:
  #   coremltools, diffusers (only for tokenizer/scheduler glue)
  # We intentionally do NOT pin these here; `./novel doctor` installs the
  # chosen backend on demand so 16GB users don't pay the disk cost upfront.
]

[project.optional-dependencies]
# Heavyweight extras, opt-in via:  uv pip install -e ".[image-mlx]"
image-mlx = [
  "mlx>=0.20.0",
  "mlx-lm>=0.20.0",
  "transformers>=4.46.0",
  "Pillow>=11.0.0",
]
image-coreml = [
  "coremltools>=8.1",
  "diffusers>=0.31.0",
  "transformers>=4.46.0",
  "Pillow>=11.0.0",
]
align = [
  # Whisper-MLX for forced subtitle alignment on the Neural Engine
  "mlx-whisper>=0.4.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
# Lets you run `thai-novel ...` directly if .venv/bin is on PATH.
# The `./novel` bash wrapper is the recommended entry point.
thai-novel = "thai_novel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thai_novel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]  # line length is handled by formatter
